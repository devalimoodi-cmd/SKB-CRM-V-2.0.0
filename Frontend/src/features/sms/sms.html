<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت پیامک‌ها</title>

    <!-- Vendor Styles -->
    <link rel="stylesheet" href="./../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <!-- Core Styles -->
    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/global.css">

    <!-- Shared Components Styles -->
    <link rel="stylesheet" href="/shared/components/header/header.css">
    <link rel="stylesheet" href="/shared/components/breadcrumb/breadcrumb.css">
    <link rel="stylesheet" href="/shared/components/footer/footer.css">

    <!-- Feature Styles -->
    <link rel="stylesheet" href="sms.css">

    <link rel="icon" type="image/png" href="/assets/images/favicon.ico">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header id="main-header"></header>

    <!-- ===== BREADCRUMB ===== -->
    <div class="breadcrumb-container">
        <nav class="breadcrumb_wraper">
            <ol class="breadcrumb_main">
                <li class="breadcrumb-item">
                    <a href="/" class="breadcrumb-item-link">
                        <i class="fas fa-home"></i>
                        <span class="breadcrumb-item_text">صفحه اصلی</span>
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a href="#" class="breadcrumb-item-link">
                        <i class="fas fa-sms"></i>
                        <span class="breadcrumb-item_text">مدیریت پیامک‌ها</span>
                    </a>
                </li>
            </ol>
        </nav>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container-fluid">
        <div class="sms-container">

            <!-- Header -->
            <div class="sms-header">
                <h1>
                    <i class="fas fa-sms"></i>
                    مدیریت پیامک‌ها
                </h1>
                <div class="sms-header-actions">
                    <div class="sms-credit">
                        <span class="credit-label">اعتبار:</span>
                        <span class="credit-value" id="smsCredit">0</span>
                        <span class="credit-label">پیامک</span>
                    </div>
                    <button class="btn-refresh" id="refreshSms" title="بروزرسانی">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <!-- Statistics -->
            <div class="sms-stats">
                <div class="stat-item">
                    <span class="stat-value" id="statTotalSent">0</span>
                    <span class="stat-label">کل ارسال</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value delivered" id="statDelivered">0</span>
                    <span class="stat-label">تحویل داده شده</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value failed" id="statFailed">0</span>
                    <span class="stat-label">ناموفق</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value pending" id="statPending">0</span>
                    <span class="stat-label">در انتظار</span>
                </div>
            </div>

            <!-- Send Form -->
            <div class="sms-send-form">
                <div class="form-group">
                    <label>مشتری <span class="required">*</span></label>
                    <select id="smsCustomerId" class="form-control">
                        <option value="">انتخاب مشتری...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>قالب پیامک</label>
                    <select id="templateSelect" class="form-control">
                        <option value="">انتخاب قالب...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>متن پیامک <span class="required">*</span></label>
                    <textarea id="smsMessage" class="form-control" rows="6"
                        placeholder="متن پیامک را وارد کنید..."></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span> / <span id="charLimit">500</span> کاراکتر
                    </div>
                </div>

                <div class="form-group">
                    <label>پیش‌نمایش</label>
                    <div id="smsPreview" class="sms-preview">
                        <div class="preview-content">
                            <i class="fas fa-sms" style="color: #94a3b8;"></i>
                            <span>پیش‌نمایش پیامک در اینجا نمایش داده می‌شود</span>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn-send-sms" id="sendSmsBtn">
                        <i class="fas fa-paper-plane"></i> ارسال پیامک
                    </button>
                    <button class="btn-send-bulk" id="sendBulkSmsBtn">
                        <i class="fas fa-users"></i> ارسال گروهی
                    </button>
                    <button class="btn-clear" id="clearSmsForm">
                        <i class="fas fa-undo"></i> پاک کردن
                    </button>
                </div>
            </div>

            <!-- Filters -->
            <div class="sms-filters">
                <div class="filter-group">
                    <input type="text" id="smsSearch" class="filter-input" placeholder="جستجو...">
                    <i class="fas fa-search filter-icon"></i>
                </div>
                <div class="filter-group">
                    <select id="filterStatus" class="filter-select">
                        <option value="all">همه وضعیت‌ها</option>
                        <option value="pending">⏳ در انتظار</option>
                        <option value="sent">📱 ارسال شده</option>
                        <option value="delivered">✅ تحویل داده شده</option>
                        <option value="failed">❌ ناموفق</option>
                    </select>
                </div>
                <div class="filter-group">
                    <input type="date" id="filterDateFrom" class="filter-input" placeholder="از تاریخ">
                </div>
                <div class="filter-group">
                    <input type="date" id="filterDateTo" class="filter-input" placeholder="تا تاریخ">
                </div>
                <button class="btn-reset-filters" id="resetSmsFilters">
                    <i class="fas fa-undo"></i> ریست
                </button>
            </div>

            <!-- History List -->
            <div class="sms-history-list" id="smsHistoryList">
                <div style="text-align: center; padding: 40px; color: #94a3b8;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 24px; display: block; margin-bottom: 10px;"></i>
                    <span>در حال بارگذاری...</span>
                </div>
            </div>

            <!-- Pagination -->
            <div class="sms-pagination" id="smsPagination">
                <!-- توسط JS تولید می‌شود -->
            </div>

        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer id="main-footer"></footer>

    <!-- ===== SCRIPTS ===== -->

    <!-- Vendor Scripts -->
    <script src="./../../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="./../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./../../node_modules/sweetalert2/dist/sweetalert2.min.js"></script>


    <!-- Core Services -->
    <script src="/core/constants/api.const.js"></script>
    <script src="/core/constants/config.const.js"></script>
    <script src="/core/services/cache.service.js"></script>
    <script src="/core/services/api.service.js"></script>
    <script src="/core/services/auth.service.js"></script>
    <script src="/core/services/state.service.js"></script>
    <script src="/core/services/notification.service.js"></script>

    <!-- Utils -->
    <script src="/core/utils/date.utils.js"></script>
    <script src="/core/utils/string.utils.js"></script>
    <script src="/core/utils/dom.utils.js"></script>

    <!-- Shared Components -->
    <script src="/shared/layouts/Header/header.service.js"></script>
    <script src="/shared/layouts/Header/header-bookmarks.service.js"></script>
    <script src="/shared/layouts/Header/header-dropdown.service.js"></script>
    <script src="/shared/layouts/Footer/footer.service.js"></script>

    <!-- Feature: SMS -->
    <script src="sms.api.js"></script>
    <script src="sms.renderer.js"></script>
    <script src="sms.validation.js"></script>
    <script src="sms.service.js"></script>

    <!-- Init -->
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                // مقداردهی هدر
                if (typeof HeaderService !== 'undefined' && typeof HeaderService.init === 'function') {
                    await HeaderService.init();
                    console.log('✅ Header initialized');
                }

                // مقداردهی فوتر
                if (typeof FooterService !== 'undefined' && typeof FooterService.init === 'function') {
                    FooterService.init();
                    console.log('✅ Footer initialized');
                }

                // مقداردهی سرویس پیامک
                if (typeof smsService !== 'undefined' && typeof smsService.init === 'function') {
                    await smsService.init();
                    console.log('✅ SMS service initialized');
                }

            } catch (error) {
                console.error('❌ Error initializing SMS:', error);
            }
        });
    </script>
</body>

</html>
