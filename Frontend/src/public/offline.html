<!DOCTYPE html>
<!-- ============================================================
     offline.html — پوستهٔ آفلاین پورتال مشتری (موج ۱۳.۹)
     ------------------------------------------------------------
     ⚠️ این تنها فایلی است که service worker در نصب precache می‌کند
        (src/public/sw.js ⇒ SHELL_ASSETS).
     🔒 چرا «خودبسنده»؟ اگر برای استایل/فونت/آیکون به شبکه ارجاع
        بدهد، در حالت آفلاین همان‌ها هم لود نمی‌شوند و صفحهٔ خطا
        سفید یا بی‌ریخت می‌شود. پس: صفر فایل خارجی، صفر اسکریپت
        بیرونی، صفر درخواست شبکه. تمام CSS و آیکون inline است.
     🔒 چرا داده‌ای نمایش نمی‌دهد؟ چون پیش از این هرگز کش نشده است؛
        این صفحه فقط «اتصال قطع است» می‌گوید و راه بازگشت می‌دهد.
        هیچ دادهٔ پروندهٔ مشتری (نه HTML، نه JSON) در کش نیست.
     ============================================================ -->
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>اتصال اینترنت برقرار نیست — پورتال مشتری</title>
    <style>
        :root {
            --primary: #2c7a6e;
            --primary-soft: rgba(44, 122, 110, 0.10);
            --text-main: #1f2937;
            --text-light: #64748b;
            --bg-page: #f8fafc;
            --bg-surface: #ffffff;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-page);
            color: var(--text-main);
            font-family: "Vazirmatn", "IRANSans", "Segoe UI", Tahoma, sans-serif;
            line-height: 1.9;
        }

        .offline-card {
            width: 100%;
            max-width: 420px;
            padding: 28px 22px;
            text-align: center;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .offline-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--primary-soft);
            border: 1px solid var(--primary);
        }

        .offline-badge svg {
            width: 32px;
            height: 32px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.05rem;
            font-weight: 700;
        }

        p {
            margin: 0 0 18px;
            font-size: 0.82rem;
            color: var(--text-light);
        }

        .offline-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .offline-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            font-family: inherit;
            font-size: 0.82rem;
            color: var(--text-main);
            text-decoration: none;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
        }

        .offline-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .offline-btn--primary {
            color: #fff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .offline-btn--primary:hover {
            color: #fff;
            filter: brightness(0.95);
        }

        .offline-note {
            margin: 16px 0 0;
            font-size: 0.72rem;
            color: var(--text-light);
        }
    </style>
</head>

<body>
    <main class="offline-card">
        <div class="offline-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2c7a6e" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M2 8.82a15 15 0 0 1 20 0"></path>
                <path d="M5 12.86a10 10 0 0 1 14 0"></path>
                <path d="M8.5 16.9a5 5 0 0 1 7 0"></path>
                <line x1="12" y1="20.5" x2="12" y2="20.5"></line>
                <line x1="3" y1="3" x2="21" y2="21"></line>
            </svg>
        </div>

        <h1>اتصال اینترنت برقرار نیست</h1>
        <p>
            برای دیدن پرونده و نمودارها به اینترنت نیاز است. اتصال خود را بررسی کنید و دوباره
            تلاش کنید.
        </p>

        <div class="offline-actions">
            <button type="button" class="offline-btn offline-btn--primary" id="portalOfflineRetry"
                onclick="location.reload()">
                تلاش دوباره
            </button>
            <a class="offline-btn" href="/portal">بازگشت به پورتال</a>
        </div>

        <p class="offline-note">
            داده‌های پرونده روی این دستگاه ذخیره نمی‌شوند؛ پس از وصل‌شدن، نسخهٔ تازه نمایش داده
            می‌شود.
        </p>
    </main>
</body>

</html>
