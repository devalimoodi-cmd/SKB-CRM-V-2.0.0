<header class="header-desktop">
    <div class="header-wrapper">

        <!-- ===== بخش راست ===== -->
        <div class="header-wrapper_right">
            <div class="accuont-wrapper">
                <div class="account-wra_image">
                    <img src="/assets/images/default-avatar.png" class="image" alt="Hader-user-avatar"
                        id="headerAvatar" />
                </div>
                <div class="account-wra_arrow-btn dropdown-btn">
                    <i class="fa fa-arrow-down"></i>
                    <a class="account-content_Name" href="#" id="headerUserName">کاربر</a>
                </div>
            </div>
            <div class="account-content_dropdown dropdown-menu" id="profileDropdown">
                <!-- محتوا توسط JS پر می‌شود -->
            </div>

            <div class="button-wrapper">
                <!-- دکمه یادآوری -->
                <button type="button" class="wra_button_items dropdown-reminder-btn">
                    <i class="fas fa-bell"></i>
                    <span class="quantity" id="reminderCount">0</span>
                </button>
                <div class="reminder-wra dropdown-menu-reminder" id="reminderDropdown">
                    <div class="dropdown-body"></div>
                </div>

                <!-- دکمه پیام‌ها -->
                <button type="button" class="wra_button_items dropdown-email-btn">
                    <i class="fas fa-envelope"></i>
                    <span class="quantity" id="emailCount">0</span>
                </button>
                <div class="wra_alert_content dropdown-menu-email" id="emailDropdown">
                    <div class="dropdown-body"></div>
                </div>

                <!-- دکمه بوکمارک -->
                <button type="button" class="wra_button_items dropdown-bookmark-btn">
                    <i class="fas fa-bookmark"></i>
                    <span class="quantity" id="bookmarkCount">0</span>
                </button>
                <div class="wra_bookmarks_content dropdown-menu-bookmark" id="bookmarkDropdown">
                    <div class="dropdown-body"></div>
                </div>

                <!-- ✅ دکمه «تغییرات جدید / What's New» (مودال اطلاع‌رسانی نسخه‌ها) -->
                <button type="button" class="wra_button_items wn-header-btn" id="whatsNewBtn"
                    title="تغییرات جدید" aria-label="تغییرات جدید">
                    <i class="fas fa-gift"></i>
                    <span class="quantity" id="whatsNewCount">0</span>
                </button>
            </div>
        </div>

        <!-- ===== بخش وسط (ناوبری) ===== -->
        <div class="header-wrapper_center">
            <nav class="header-nav" id="headerNav">
                <a href="/" class="header-nav-item" data-page="dashboard">
                    <i class="fas fa-chart-bar"></i><span>داشبورد</span>
                </a>
                <a href="/customers" class="header-nav-item" data-page="register">
                    <i class="fas fa-user-plus"></i><span>ثبت نام</span>
                </a>
                <a href="/admin" class="header-nav-item" data-page="admin">
                    <i class="fas fa-user-shield"></i><span>مدیریت</span>
                </a>
            </nav>
        </div>

        <!-- ===== بخش چپ (لوگو) ===== -->
        <div class="header-wrapper_left">
            <div class="header-wrapper_left_logo-wra">
                <img class="skb-logo" src="/assets/images/skb-logo.png" alt="company-logo" id="headerLogo">
            </div>
        </div>

    </div>
</header>

<!-- ===== مودال «نظرات و پیشنهادات» (گفتگو با ادمین) ===== -->
<div class="msg-modal-overlay" id="messageThreadModal">
    <div class="msg-modal">
        <div class="msg-modal-header">
            <h3>
                <i class="fas fa-comments"></i>
                <span id="messageThreadTitle">نظرات و پیشنهادات</span>
            </h3>
            <button type="button" id="messageThreadClose" aria-label="بستن">&times;</button>
        </div>

        <div class="msg-modal-body">
            <!-- حالت ارسال پیام جدید -->
            <div id="messageComposeWrap" style="display:none;">
                <div class="info-form">
                    <label for="messageSubject">نوع پیام</label>
                    <select id="messageSubject">
                        <option value="suggestion">پیشنهاد</option>
                        <option value="complaint">انتقاد</option>
                        <option value="bug">اشکال فنی</option>
                        <option value="question">سؤال</option>
                        <option value="other">سایر</option>
                    </select>

                    <label for="messageTitle">موضوع</label>
                    <input type="text" id="messageTitle" maxlength="150" placeholder="خلاصهٔ پیام">

                    <label for="messageBody">متن پیام</label>
                    <textarea id="messageBody" maxlength="2000" placeholder="متن پیام خود را بنویسید..."></textarea>

                    <div id="messageError" class="info-error" style="display:none;"></div>

                    <button type="button" class="btn-primary-info" id="messageSend">
                        <i class="fas fa-paper-plane"></i> ارسال پیام
                    </button>
                </div>
            </div>

            <!-- حالت مشاهدهٔ گفتگو -->
            <div id="messageThreadWrap">
                <div class="msg-modal-meta" id="messageThreadMeta"></div>
                <div class="msg-thread" id="messageThreadBody">
                    <div class="msg-list-empty">در حال بارگذاری…</div>
                </div>
            </div>
        </div>

        <div class="msg-modal-footer">
            <textarea id="messageReplyInput" maxlength="2000" placeholder="پاسخ خود را بنویسید..."></textarea>
            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
                <button type="button" class="btn-ghost-info" id="messageReplyCancel">بستن</button>
                <button type="button" class="btn-primary-info" id="messageReplySend" style="margin-top:0;">
                    <i class="fas fa-paper-plane"></i> ارسال پاسخ
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== مودال «تغییرات جدید / What's New» ===== -->
<!-- محتوای مودال با whats-new.service.js ساخته می‌شود -->
<div class="wn-overlay" id="whatsNewOverlay" role="dialog" aria-modal="true" aria-label="تغییرات جدید">
    <div class="wn-modal" id="whatsNewModal"></div>
</div>
