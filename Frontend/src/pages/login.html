<!-- pages/login.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه | ستاره کیان بیرجند</title>

    <!-- ===== Vendor Styles (مسیرهای اصلاح شده) ===== -->
    <!-- ===== Vendor Styles ===== -->
    <link rel="stylesheet" href="./../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">


    <!-- ===== Core Styles ===== -->
    <link rel="stylesheet" href="/styles/global.css">

    <link rel="icon" type="image/png" href="/assets/images/favicon.ico">

    <!-- ===== ✅ موج ۱۳.۲۴ — PWA (نصب‌پذیری روی موبایل) =====
         چرا اینجا هم؟ کاربر معمولاً روی «صفحهٔ ورود» می‌ایستد؛ بدون
         manifest و آیکون ۱۹۲/۵۱۲ مرورگر رویداد beforeinstallprompt را
         هرگز نمی‌فرستد. تگ‌ها اینجا ثابت‌اند و pwa.service.js هم
         (idempotent) همان‌ها را تضمین می‌کند. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#2c7a6e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="پورتال SKB">
    <link rel="apple-touch-icon" href="/assets/images/pwa/apple-touch-icon-180.png">

    <style>
        /* ===== Login Page Styles ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            position: relative;
            min-height: 100vh;
            font-family: 'Vazir', sans-serif;
            overflow-x: hidden;
            background: var(--bg-body, #f5f7fb);
        }

        .login-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('/assets/images/login-bg.jpg') center/cover no-repeat;
            z-index: -1;
        }

        .login-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 480px;
            width: 100%;
            background: rgba(var(--surface-rgb), 0.95);
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo img {
            height: 60px;
            width: auto;
        }

        .login-logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark, #1e293b);
            margin-top: 12px;
        }

        .login-logo p {
            font-size: 13px;
            color: var(--text-gray, #64748b);
            margin-top: 4px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            position: relative;
        }

        .form-group .form-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light, #94a3b8);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group .form-control {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border: 1.5px solid var(--gray-200, #e5e7eb);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Vazir', sans-serif;
            transition: all 0.3s ease;
            background: var(--bg-surface-2, #f8fafc);
            color: var(--text-dark, #1e293b);
        }

        .form-group .form-control:focus {
            outline: none;
            border-color: var(--primary, #2c7a6e);
            background: var(--bg-surface, #fff);
            box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.1);
        }

        .form-group .form-control:focus+.form-icon {
            color: var(--primary, #2c7a6e);
        }

        .form-group .form-control::placeholder {
            color: var(--text-light, #94a3b8);
        }

        .password-toggle {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light, #94a3b8);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: all 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--primary, #2c7a6e);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .login-options .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .login-options .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary, #2c7a6e);
            cursor: pointer;
        }

        .login-options .form-check label {
            cursor: pointer;
            color: var(--text-slate, #475569);
        }

        .login-options .forgot-link {
            color: var(--primary, #2c7a6e);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .login-options .forgot-link:hover {
            color: var(--primary-dark, #035552);
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary, #2c7a6e) 0%, var(--primary-dark, #035552) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Vazir', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(var(--primary-rgb), 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-login .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(var(--surface-rgb), 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-login.loading .spinner {
            display: inline-block;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .login-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light, #eef2f6);
            text-align: center;
            font-size: 12px;
            color: var(--text-light, #94a3b8);
        }

        .login-footer a {
            color: var(--primary, #2c7a6e);
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .login-message {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .login-message.error {
            display: flex;
            background: var(--danger-bg, #fee2e2);
            color: var(--danger, #dc2626);
            border: 1px solid var(--danger-mist, #fecaca);
        }

        .login-message.success {
            display: flex;
            background: var(--success-bg, #dcfce7);
            color: var(--success-strong, #16a34a);
            border: 1px solid var(--success-mist-3, #bbf7d0);
        }

        .login-message.warning {
            display: flex;
            background: var(--warning-soft, #fffbeb);
            color: var(--warning-deep, #b45309);
            border: 1px solid var(--c-fde68a, #fde68a);
        }

        /* ===== مرحلهٔ ۲ ورود: کد پیامکی (فاز ۱۳.۱) ===== */
        .login-form[hidden] {
            display: none;
        }

        .otp-hint {
            font-size: 13px;
            line-height: 1.9;
            color: var(--text-slate, #475569);
            text-align: center;
        }

        .otp-hint strong {
            color: var(--primary-dark, #035552);
            direction: ltr;
            display: inline-block;
        }

        .otp-input {
            text-align: center;
            direction: ltr;
            letter-spacing: 10px;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Vazir', monospace;
            padding: 12px 14px 12px 44px;
        }

        .otp-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-gray, #64748b);
        }

        .otp-timer strong {
            direction: ltr;
            font-size: 15px;
            color: var(--primary-dark, #035552);
        }

        .otp-timer.expired strong {
            color: var(--danger, #dc2626);
        }

        .otp-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 13px;
        }

        .otp-link {
            background: none;
            border: none;
            color: var(--primary, #2c7a6e);
            font-family: 'Vazir', sans-serif;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 0;
            transition: all 0.3s ease;
        }

        .otp-link:hover:not(:disabled) {
            color: var(--primary-dark, #035552);
            text-decoration: underline;
        }

        .otp-link:disabled {
            color: var(--text-light, #94a3b8);
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 30px 24px;
                max-width: 95%;
            }

            .login-logo img {
                height: 48px;
            }

            .login-logo h1 {
                font-size: 20px;
            }

            .btn-login {
                font-size: 15px;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px 16px;
            }

            .login-options {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .login-logo h1 {
                font-size: 18px;
            }

            .form-group .form-control {
                font-size: 13px;
                padding: 10px 40px 10px 12px;
            }
        }

        /* ===== کپچا (کد امنیتی) ===== */
        .captcha-group {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .captcha-group .form-control {
            flex: 1;
            min-width: 0;
        }

        .captcha-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-surface, #ffffff);
            border: 1px solid var(--c-e2e8e4, #e2e8e4);
            border-radius: 12px;
            padding: 4px 8px;
            justify-content: center;
        }

        .captcha-box img {
            height: 40px;
            width: auto;
            display: block;
            cursor: pointer;
            border-radius: 6px;
        }

        .captcha-refresh {
            border: none;
            background: transparent;
            color: var(--primary, #2c7a6e);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            line-height: 1;
        }

        .captcha-refresh:hover {
            color: var(--c-1f5d54, #1f5d54);
            transform: rotate(90deg);
            transition: transform 0.2s ease;
        }
    </style>
</head>

<body>

    <div class="login-bg"></div>

    <div class="login-container">
        <div class="login-logo">
            <img src="/assets/images/skb-logo.png" alt="ستاره کیان بیرجند">
            <h1>ورود به سِکاد</h1>
            <p>سامانه مدیریت اطلاعات، خدمات و ارتباطات با مشتریان</p>
        </div>

        <form class="login-form" id="loginForm" autocomplete="off">
            <div class="login-message" id="loginMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="messageText"></span>
            </div>

            <div class="form-group">
                <input type="text" class="form-control" id="username"
                    placeholder="نام کاربری، ایمیل یا شمارهٔ موبایل" autocomplete="username" required>
                <i class="fas fa-user-circle form-icon"></i>
            </div>

            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder="رمز عبور"
                    autocomplete="current-password" required>
                <i class="fas fa-lock form-icon"></i>
                <button type="button" class="password-toggle" id="togglePassword" tabindex="-1">
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>

            <!-- ✅ کد امنیتی (کپچا) — در صورت فعال بودن در سرور نمایش داده می‌شود -->
            <div class="form-group captcha-group" id="captchaGroup">
                <input type="text" class="form-control" id="captchaAnswer" placeholder="کد امنیتی تصویر"
                    autocomplete="off" maxlength="8">
                <div class="captcha-box">
                    <img id="captchaImage" alt="کد امنیتی" title="برای تصویر جدید کلیک کنید">
                    <button type="button" class="captcha-refresh" id="captchaRefresh" title="تصویر جدید">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <!-- ✅ ورود دومرحله‌ای (فاز ۱۳.۱): گزینهٔ «ذخیرهٔ دستگاه» حذف شد.
                 هر ورود، در هر نقش، به کد پیامکی نیاز دارد. -->
            <div class="login-options">
                <a href="#" class="forgot-link" id="forgotPasswordBtn">رمز عبور را فراموش کرده‌ام</a>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">ورود</span>
                <span class="spinner"></span>
                <i class="fas fa-arrow-left btn-icon"></i>
            </button>
        </form>

        <!-- ===== مرحلهٔ ۲: کد یک‌بارمصرف پیامکی ===== -->
        <form class="login-form" id="otpForm" autocomplete="off" hidden>
            <div class="login-message" id="otpMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="otpMessageText"></span>
            </div>

            <p class="otp-hint">
                کد ۶ رقمی ارسال‌شده به
                <strong id="otpMobile">شمارهٔ شما</strong>
                را وارد کنید
            </p>

            <div class="form-group">
                <input type="text" class="form-control otp-input" id="otpCode" placeholder="------"
                    inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required>
                <i class="fas fa-shield-alt form-icon"></i>
            </div>

            <div class="otp-timer" id="otpTimer">
                <strong id="otpCountdown">03:00</strong>
                <span>تا پایان اعتبار کد</span>
            </div>

            <button type="submit" class="btn-login" id="otpBtn">
                <span class="btn-text">تایید و ورود</span>
                <span class="spinner"></span>
                <i class="fas fa-check btn-icon"></i>
            </button>

            <div class="otp-actions">
                <button type="button" class="otp-link" id="otpResend" disabled>ارسال مجدد کد</button>
                <button type="button" class="otp-link" id="otpBack">بازگشت</button>
            </div>
        </form>

        <div class="login-footer">
            <p>
                <i class="fas fa-copyright"></i>
                کلیه حقوق متعلق به واحد تحقیق و توسعه کارخانه ستاره کیان بیرجند است.
            </p>
            <p style="margin-top: 4px;">
                <!-- ✅ فاز ۱۳.۶ — ثبت‌نام عمومی مشتری (سرور تعیین می‌کند باز است یا نه) -->
                <a href="/register"><i class="fas fa-user-plus"></i> ثبت‌نام مشتری</a> •
                <a href="/about">درباره ما</a> •
                <a href="/help">راهنما</a> •
                <a href="/contact">تماس با ما</a>
            </p>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->

    <!-- ✅ Vendor Scripts (مسیرهای اصلاح شده) -->
    <script src="./../../node_modules/jquery/dist/jquery.min.js"></script>
    <script src="./../../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>

    <!-- ✅ Core Scripts (همه با type="module") -->
    <script type="module" src="/core/constants/api.const.js"></script>
    <script type="module" src="./../core/constants/config.const.js"></script>
    <!-- ✅ موج ۱۳.۲۴ — PWA: تگ‌های head + ثبت service worker + نگه‌داشتن
         رویداد beforeinstallprompt (پیش از این فقط پورتال این را داشت) -->
    <script type="module" src="/core/services/pwa.service.js"></script>
    <script type="module" src="/core/services/cache.service.js"></script>
    <script type="module" src="/core/services/api.service.js"></script>
    <script type="module" src="/core/services/auth.service.js"></script>
    <script type="module" src="/core/services/state.service.js"></script>
    <script type="module" src="/core/services/notification.service.js"></script>

    <!-- ✅ Utils (همه با type="module") -->
    <script type="module" src="/core/utils/string.utils.js"></script>
    <script type="module" src="/core/utils/dom.utils.js"></script>

    <!-- ✅ Login Script (بدون module - چون از window استفاده می‌کنه) -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('loginForm');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const togglePassword = document.getElementById('togglePassword');
            const message = document.getElementById('loginMessage');
            const messageText = document.getElementById('messageText');
            const captchaGroup = document.getElementById('captchaGroup');
            const captchaImage = document.getElementById('captchaImage');
            const captchaAnswer = document.getElementById('captchaAnswer');
            const captchaRefresh = document.getElementById('captchaRefresh');

            // ===== مرحلهٔ ۲ (کد پیامکی) — فاز ۱۳.۱ =====
            const otpForm = document.getElementById('otpForm');
            const otpCode = document.getElementById('otpCode');
            const otpBtn = document.getElementById('otpBtn');
            const otpMobile = document.getElementById('otpMobile');
            const otpCountdown = document.getElementById('otpCountdown');
            const otpTimer = document.getElementById('otpTimer');
            const otpResend = document.getElementById('otpResend');
            const otpBack = document.getElementById('otpBack');
            const otpMessage = document.getElementById('otpMessage');
            const otpMessageText = document.getElementById('otpMessageText');

            // وضعیت چالش جاری (فقط در حافظهٔ همین صفحه — بدون ذخیره در localStorage)
            let challengeId = null;
            let countdownTimer = null;
            let resendTimer = null;
            let secondsLeft = 0;
            let resendLeft = 0;

            // ✅ وضعیت کپچا (از سرور خوانده می‌شود)
            let captchaId = null;
            let captchaEnabled = false;

            // ============================================================
            // ✅ «نشست منقضی شد» — به‌جای پرت‌شدن بی‌صدا به صفحهٔ ورود
            // (api.service.js پیش از هدایت، یک فلگ یک‌بارمصرف می‌گذارد)
            // ============================================================
            function showSessionExpiredOnce() {
                let expired = false;
                try {
                    expired = sessionStorage.getItem('skb_session_expired') === '1';
                    if (expired) sessionStorage.removeItem('skb_session_expired');
                } catch {
                    expired = false;
                }
                if (!expired) return;

                // پیام درون‌صفحه‌ای (اگر کاربر مودال را ببندد، دلیلش را بداند)
                showMessage('نشست شما منقضی شد؛ لطفاً دوباره وارد شوید', 'warning');

                // مودال — تنها استثنایی که مودال استفاده می‌کنیم (کاربر باید متوجه شود)
                import('/core/services/notification.service.js')
                    .then(({ notificationService }) =>
                        notificationService?.confirm?.({
                            title: 'نشست شما منقضی شد',
                            text: 'برای ادامهٔ کار دوباره وارد شوید.',
                            confirmText: 'ورود',
                            icon: 'warning',
                        }),
                    )
                    .then(() => username?.focus?.())
                    .catch(() => { /* اگر ماژول اعلان نبود، پیام درون‌صفحه‌ای کافی است */ });
            }

            showSessionExpiredOnce();


            // ✅ موج ۱۳.۲۴ — بررسی دسترسی به سرور (بدون احراز هویت)
            // چرا؟ اگر بک‌اند/پروکسی بالا نباشد، کاربر فقط «Failed to
            // fetch» می‌دید و نمی‌دانست مشکل از صفحه است یا سرور.
            // /api/ping عمومی است (بدون protect) و از پروکسی هم‌مبدأ می‌آید.
            async function probeServer() {
                try {
                    const response = await fetch('/api/ping', {
                        headers: { Accept: 'application/json' },
                        cache: 'no-store',
                    });
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return true;
                } catch (error) {
                    console.error('❌ Server probe failed:', error);
                    showMessage('ارتباط با سرور برقرار نشد — از اجرا بودن بک‌اند مطمئن شوید', 'error');
                    return false;
                }
            }

            async function loadCaptcha(clearMessage = true) {
                try {
                    const response = await fetch('/api/captcha', {
                        headers: { Accept: 'application/json' },
                        cache: 'no-store',
                    });
                    const json = await response.json().catch(() => null);
                    const data = json && json.success ? json.data : null;

                    if (data && data.enabled) {
                        captchaEnabled = true;
                        captchaId = data.id;
                        captchaImage.src =
                            'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data.svg);
                        captchaGroup.style.display = 'flex';
                        captchaAnswer.setAttribute('required', 'required');
                    } else {
                        // سرور کپچا را غیرفعال کرده است
                        captchaEnabled = false;
                        captchaId = null;
                        captchaGroup.style.display = 'none';
                        captchaAnswer.removeAttribute('required');
                    }

                    captchaAnswer.value = '';
                } catch (error) {
                    // اگر گرفتن کپچا ممکن نبود، ورود را قفل نمی‌کنیم؛
                    // سرور خودش تصمیم می‌گیرد و پیام مناسب را برمی‌گرداند.
                    console.error('❌ خطا در دریافت کپچا:', error);
                    // ✅ اطلاع کوتاه به کاربر (بدون قفل‌کردن ورود)
                    import('/core/services/notification.service.js')
                        .then(({ notificationService }) => {
                            notificationService?.notifyOnce?.({
                                key: 'login-captcha-failed',
                                type: 'warning',
                                message: 'دریافت کد امنیتی ناموفق بود — صفحه را نو کنید',
                            });
                        })
                        .catch(() => { /* اگر ماژول اعلان در دسترس نبود، بی‌صدا رد شو */ });
                    captchaEnabled = false;
                    captchaGroup.style.display = 'none';
                    captchaAnswer.removeAttribute('required');
                }

                if (clearMessage) showMessage('');
            }

            function showMessage(text, type = 'error') {
                message.className = `login-message ${type}`;
                messageText.textContent = text;
                message.style.display = text ? 'flex' : 'none';
            }

            captchaRefresh.addEventListener('click', () => loadCaptcha());
            captchaImage.addEventListener('click', () => loadCaptcha());
            captchaAnswer.addEventListener('input', () => showMessage(''));

            togglePassword.addEventListener('click', function () {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                const icon = this.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });

            // ============================================================
            // مرحلهٔ ۲ — کد پیامکی (فاز ۱۳.۱)
            // ============================================================
            function showOtpMessage(text, type = 'error') {
                otpMessage.className = `login-message ${type}`;
                otpMessageText.textContent = text;
                otpMessage.style.display = text ? 'flex' : 'none';
            }

            const two = (n) => String(n).padStart(2, '0');

            function stopTimers() {
                if (countdownTimer) clearInterval(countdownTimer);
                if (resendTimer) clearInterval(resendTimer);
                countdownTimer = null;
                resendTimer = null;
            }

            function paintCountdown() {
                otpCountdown.textContent = `${two(Math.floor(secondsLeft / 60))}:${two(secondsLeft % 60)}`;
                otpTimer.classList.toggle('expired', secondsLeft <= 0);
            }

            function startCountdown(expiresIn) {
                secondsLeft = Math.max(0, Number(expiresIn) || 0);
                paintCountdown();
                if (countdownTimer) clearInterval(countdownTimer);
                countdownTimer = setInterval(() => {
                    secondsLeft -= 1;
                    if (secondsLeft <= 0) {
                        secondsLeft = 0;
                        clearInterval(countdownTimer);
                        countdownTimer = null;
                        paintCountdown();
                        showOtpMessage('کد منقضی شد؛ کد جدید بگیرید', 'warning');
                        otpResend.disabled = false;
                        otpResend.textContent = 'ارسال کد جدید';
                        return;
                    }
                    paintCountdown();
                }, 1000);
            }

            function startResendCooldown(seconds) {
                resendLeft = Math.max(0, Number(seconds) || 0);
                if (resendTimer) clearInterval(resendTimer);

                const paint = () => {
                    if (resendLeft > 0) {
                        otpResend.disabled = true;
                        otpResend.textContent = `ارسال مجدد تا ${two(resendLeft)}`;
                    } else {
                        otpResend.disabled = false;
                        otpResend.textContent = 'ارسال مجدد کد';
                    }
                };

                paint();
                if (resendLeft <= 0) return;

                resendTimer = setInterval(() => {
                    resendLeft -= 1;
                    paint();
                    if (resendLeft <= 0) {
                        clearInterval(resendTimer);
                        resendTimer = null;
                    }
                }, 1000);
            }

            function showOtpStep({ challengeId: id, maskedMobile, expiresIn, resendAfter }) {
                challengeId = id;
                otpMobile.textContent = maskedMobile || 'شمارهٔ ثبت‌شده';
                otpCode.value = '';
                showOtpMessage('');
                form.hidden = true;
                otpForm.hidden = false;
                startCountdown(expiresIn);
                startResendCooldown(resendAfter);
                otpCode.focus();
            }

            function backToLoginStep() {
                stopTimers();
                challengeId = null;
                otpForm.hidden = true;
                form.hidden = false;
                showOtpMessage('');
                showMessage('');
                password.value = '';
                if (captchaEnabled) loadCaptcha(false);
                password.focus();
            }

            // ✅ هدایت بر اساس نقش (یک منبع حقیقت مشترک با سرور)
            function goToLanding(authService) {
                const role = authService.getUserRole();
                if (['super_admin', 'admin'].includes(role)) {
                    window.location.href = '/admin';
                } else if (role === 'sub_admin' || role === 'expert') {
                    window.location.href = '/';
                } else {
                    window.location.href = '/customer-info';
                }
            }

            // ✅ «ذخیرهٔ دستگاه» حذف شد (ورود دومرحله‌ای برای همهٔ نقش‌ها)؛
            //    فقط نام کاربریِ آخرین ورود برای راحتی نگه داشته می‌شود.
            const lastUsername = localStorage.getItem('savedUsername');
            if (lastUsername) username.value = lastUsername;

            // ✅ دریافت کد امنیتی هنگام باز شدن صفحه
            loadCaptcha(false);
            // ✅ موج ۱۳.۲۴ — و یک بررسی سبک از دسترسی به سرور (پیام گویا)
            probeServer();

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const user = username.value.trim();
                const pass = password.value;

                if (!user || !pass) {
                    showMessage('لطفاً نام کاربری و رمز عبور را وارد کنید', 'error');
                    return;
                }

                const captchaCode = captchaAnswer.value.trim();

                if (captchaEnabled && !captchaCode) {
                    showMessage('کد امنیتی تصویر را وارد کنید', 'error');
                    captchaAnswer.focus();
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.classList.add('loading');

                try {
                    // ✅ استفاده از authService که به صورت module لود شده
                    const { authService } = await import('/core/services/auth.service.js');
                    const result = await authService.login(user, pass, {
                        id: captchaId,
                        answer: captchaCode,
                    });

                    // 🔐 مرحلهٔ ۲ لازم است ⇒ هیچ توکنی صادر نشده است
                    if (result && result.requiresOtp) {
                        // آخرین نام کاربری برای راحتیِ ورود بعدی نگه داشته می‌شود
                        try {
                            localStorage.setItem('savedUsername', user);
                            localStorage.removeItem('rememberMe');
                        } catch { /* حالت خصوصی مرورگر */ }

                        showMessage('');
                        showOtpStep(result);
                        showOtpMessage(result.message || 'کد ورود پیامک شد', 'success');
                        return;
                    }

                    // ✅ ورود کامل (فقط وقتی دومرحله‌ای سمت سرور خاموش است)
                    if (result) {
                        try {
                            localStorage.setItem('savedUsername', user);
                        } catch { /* حالت خصوصی مرورگر */ }

                        showMessage('✅ ورود با موفقیت انجام شد', 'success');
                        setTimeout(() => goToLanding(authService), 800);
                    }
                } catch (error) {
                    showMessage(error.message || 'نام کاربری یا رمز عبور اشتباه است', 'error');

                    // ✅ کد امنیتی یک‌بارمصرف است؛ تصویر جدید گرفته می‌شود
                    if (captchaEnabled) await loadCaptcha(false);
                    captchaAnswer.focus();
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                }
            });

            // ===== مرحلهٔ ۲: تایید کد پیامکی =====
            otpForm.addEventListener('submit', async function (e) {
                e.preventDefault();

                const code = otpCode.value.replace(/[^0-9]/g, '').slice(0, 6);

                if (!challengeId) {
                    backToLoginStep();
                    showMessage('لطفاً دوباره وارد شوید', 'warning');
                    return;
                }

                if (code.length !== 6) {
                    showOtpMessage('کد ۶ رقمی را کامل وارد کنید', 'error');
                    otpCode.focus();
                    return;
                }

                otpBtn.disabled = true;
                otpBtn.classList.add('loading');

                try {
                    const { authService } = await import('/core/services/auth.service.js');
                    await authService.verifyLoginOtp(challengeId, code);

                    stopTimers();
                    showOtpMessage('✅ ورود با موفقیت انجام شد', 'success');
                    setTimeout(() => goToLanding(authService), 400);
                } catch (error) {
                    showOtpMessage(error.message || 'کد وارد‌شده معتبر نیست', 'error');
                    otpCode.value = '';
                    otpCode.focus();
                } finally {
                    otpBtn.disabled = false;
                    otpBtn.classList.remove('loading');
                }
            });

            // ===== مرحلهٔ ۲: ارسال مجدد کد =====
            otpResend.addEventListener('click', async function () {
                if (!challengeId) {
                    backToLoginStep();
                    return;
                }

                otpResend.disabled = true;

                try {
                    const { authService } = await import('/core/services/auth.service.js');
                    const result = await authService.resendLoginOtp(challengeId);

                    if (result.maskedMobile) otpMobile.textContent = result.maskedMobile;
                    otpCode.value = '';
                    startCountdown(result.expiresIn);
                    startResendCooldown(result.resendAfter);
                    showOtpMessage('کد جدید پیامک شد', 'success');
                    otpCode.focus();
                } catch (error) {
                    // اگر سرور بگوید «زود است»، شمارش معکوس با همان ثانیه‌ها ادامه می‌یابد
                    if (error.waitSeconds) {
                        startResendCooldown(error.waitSeconds);
                    } else {
                        otpResend.disabled = false;
                    }
                    showOtpMessage(error.message || 'ارسال مجدد ناموفق بود', 'error');
                }
            });

            // ===== مرحلهٔ ۲: بازگشت به مرحلهٔ ۱ =====
            otpBack.addEventListener('click', async function () {
                if (challengeId) {
                    try {
                        const { authService } = await import('/core/services/auth.service.js');
                        await authService.cancelLoginOtp(challengeId);
                    } catch { /* لغو اختیاری است */ }
                }
                backToLoginStep();
            });

            // فقط رقم پذیرفته می‌شود (چسباندن کد پیامک هم درست کار می‌کند)
            otpCode.addEventListener('input', () => {
                otpCode.value = otpCode.value.replace(/[^0-9]/g, '').slice(0, 6);
                showOtpMessage('');
            });

            document.getElementById('forgotPasswordBtn').addEventListener('click', function (e) {
                e.preventDefault();
                showMessage('لطفاً با پشتیبانی سیستم تماس بگیرید', 'info');
            });

            username.addEventListener('input', () => showMessage(''));
            password.addEventListener('input', () => showMessage(''));
        });
    </script>
