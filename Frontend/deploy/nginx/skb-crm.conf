// ============================================================
//  SKB-CRM  |  Nginx reverse proxy
//  این فایل روی «سرور» قرار می‌گیرد (نه داخل کد اجرایی).
// ------------------------------------------------------------
//  معماری:
//    مرورگر ──► Nginx (:80 / :443) ──► Frontend Express (:3000)
//                                          ├─ صفحه‌ها، JS، CSS، تصاویر
//                                          ├─ /api/*      → backend :5000
//                                          └─ /uploads/*  → backend :5000
//  فقط پورت‌های ۸۰/۴۴۳ عمومی می‌مانند؛ ۳۰۰۰ و ۵۰۰۰ داخلی و امن هستند.
//  پیش‌نیاز: Frontend/server.js روی 127.0.0.1:3000 و Backend روی 127.0.0.1:5000
// ============================================================

upstream skb_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------- HTTP ----------------
server {
    listen      80;
    listen      [::]:80;
    server_name skb-crm.ir www.skb-crm.ir;   # ← دامنه یا آی‌پی واقعی را بگذار

    client_max_body_size 600m;               # آپلود تا ~۵۰۰MB

    access_log logs/skb-crm.access.log;
    error_log  logs/skb-crm.error.log warn;

    # اگر SSL فعال کردی، این خط را از کامنت دربیاور تا HTTP به HTTPS هدایت شود:
    # return 301 https://$host$request_uri;

    # ============ API (JSON + آپلود/دانلود فایل) ============
    location /api/ {
        proxy_pass              http://skb_frontend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_request_buffering off;         # فایل بزرگ روی دیسک Nginx ذخیره نشود
        client_body_timeout     600s;
        proxy_connect_timeout   30s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;
    }

    # ============ فایل‌های آپلودشده (تصاویر/پیوست‌ها) ============
    location /uploads/ {
        proxy_pass       http://skb_frontend;
        proxy_set_header Host $host;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # ============ بقیهٔ مسیرها: صفحه‌ها، core، features، shared، styles، vendor ============
    location / {
        proxy_pass              http://skb_frontend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_read_timeout      120s;
    }

    # ============ gzip ============
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/woff2;
}

# ---------------- HTTPS (اختیاری) ----------------
# روی لینوکس ساده‌ترین راه:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d skb-crm.ir -d www.skb-crm.ir
# (certbot خودش بلوک ۴۴۳ را می‌سازد و همان locationها را کپی می‌کند)
#
# اگر دستی می‌سازی، در بلوک زیر همان سه location بالا را هم تکرار کن:
#
# server {
#     listen               443 ssl;
#     listen               [::]:443 ssl;
#     server_name          skb-crm.ir www.skb-crm.ir;
#     ssl_certificate      /etc/letsencrypt/live/skb-crm.ir/fullchain.pem;
#     ssl_certificate_key  /etc/letsencrypt/live/skb-crm.ir/privkey.pem;
#     ssl_protocols        TLSv1.2 TLSv1.3;
#     ssl_session_cache    shared:SSL:10m;
#     ssl_session_timeout  10m;
#     client_max_body_size 600m;
# }

# ---------------- نکتهٔ امنیتی ----------------
# پورت ۵۰۰۰ (بک‌اند) را از اینترنت باز نکن؛ همهٔ درخواست‌ها از همین Nginx و
# از طریق پروکسی هم‌مبدأ «/api» رد می‌شوند. پس CORS هم لازم نیست.
